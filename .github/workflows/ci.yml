name: Budget Buddy CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Verify Backend
        working-directory: backend
        run: |
          node --version
          npm --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t budget-buddy-backend:ci \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t budget-buddy-frontend:ci \
            ./frontend

      - name: Start Application with Docker Compose
        run: docker compose up -d

      - name: Check Backend Health
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:5000/api/health; then
              echo "Backend is healthy."
              exit 0
            fi

            echo "Backend not ready yet. Retrying..."
            sleep 2
          done

          echo "Backend failed to become healthy."
          docker compose logs
          exit 1

      - name: Check Frontend Availability
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3000; then
              echo "Frontend is available."
              exit 0
            fi

            echo "Frontend not ready yet. Retrying..."
            sleep 2
          done

          echo "Frontend failed to become available."
          docker compose logs frontend
          exit 1

      - name: Smoke Test Expense API
        run: |
          if curl --fail --silent --show-error http://localhost:5000/api/expense; then
            echo "Expense API smoke test passed."
          else
            echo "Expense API smoke test failed."
            docker compose logs backend
            exit 1
          fi

      - name: Shut Down Application
        if: always()
        run: docker compose down